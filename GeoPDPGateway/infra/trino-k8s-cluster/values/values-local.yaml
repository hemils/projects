image:
  tag: "480"

server:
  workers: 1

additionalConfigProperties:
  - http-server.process-forwarded=true
  - catalog.management=dynamic

envFrom:
  - secretRef:
      name: trino-adls-credentials

coordinator:
  replicas: 1
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

worker:
  replicas: 1
  resources:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"