replicaCount: 1

config:
  serverConfig:
    node.environment: local
    http-server.http.enabled: true
    http-server.http.port: 8080
    http-server.process-forwarded: true
  dataStore:
    # Credentials are overridden at install time from the existing
    # hive-metastore-db-secret in the default namespace.
    jdbcUrl: jdbc:postgresql://host.docker.internal:5432/trinodb
    user: hiveuser
    password: replace-at-deploy-time
    driver: org.postgresql.Driver
    queryHistoryEnabled: false
  clusterStatsConfiguration:
    monitorType: INFO_API
  routing:
    defaultRoutingGroup: adhoc
  requestAnalyzerConfig:
    analyzeRequest: true
  routingRules:
    # Enable only after both Trino coordinators enforce OAUTH2 over trusted HTTPS.
    rulesEngineEnabled: false
    rulesType: EXTERNAL
    rulesExternalConfiguration:
      urlPath: http://routing-api.default.svc.cluster.local:8080/gateway-rules
      # The selector validates this bearer token against the configured Entra JWKS.
      # Gateway still forwards the original token to the selected Trino coordinator.
      excludeHeaders:
        - Cookie
        - X-Trino-Routing-Group
      propagateErrors: true

service:
  type: ClusterIP
  ports:
    - protocol: TCP
      name: gateway

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 1536Mi